<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>国庆关西五日游 · 大阪京都神户攻略书</title>
  <meta name="description" content="2026国庆大阪、京都、神户、天桥立五日自由行完整攻略书" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <style>
    :root {
      --vermilion: #C73E3A;
      --vermilion-deep: #A3302D;
      --gold: #D4A24E;
      --paper: #FBF7F0;
      --ink: #2B2B2B;
      --indigo: #1F2A44;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .font-serif-sc { font-family: 'Noto Serif SC', serif; }
    .font-brush { font-family: 'Ma Shan Zheng', cursive; }
    .paper-texture {
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(212,162,78,0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(199,62,58,0.04) 0%, transparent 40%);
    }
    .hero-overlay {
      background:
        linear-gradient(90deg, rgba(20,18,22,0.82) 0%, rgba(20,18,22,0.48) 45%, rgba(20,18,22,0.22) 100%),
        linear-gradient(180deg, rgba(20,18,22,0.5) 0%, rgba(20,18,22,0.12) 35%, rgba(20,18,22,0.78) 100%);
    }
    .hero-chip { backdrop-filter: blur(8px); transition: transform .3s, background .3s; }
    .hero-chip:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
    .stamp {
      border: 2px solid var(--vermilion);
      color: var(--vermilion);
      transform: rotate(-8deg);
      letter-spacing: 0.3em;
    }
    .timeline-line { background: linear-gradient(180deg, var(--vermilion), var(--gold)); }
    .card-hover { transition: transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s; }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -16px rgba(31,42,68,.22); }
    .img-zoom { overflow: hidden; }
    .img-zoom img { transition: transform .6s cubic-bezier(.22,1,.36,1); }
    .img-zoom:hover img { transform: scale(1.06); }
    .fade-up { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s ease; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    .nav-link.active { color: var(--vermilion); }
    .nav-link.active::after { transform: scaleX(1); }
    .nav-link::after {
      content: ''; position: absolute; left: 0; bottom: -4px; width: 100%; height: 2px;
      background: var(--vermilion); transform: scaleX(0); transform-origin: left; transition: transform .3s;
    }
    .day-tab { transition: all .3s; }
    .day-tab.active { background: var(--vermilion); color: #fff; border-color: var(--vermilion); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #f0e9dd; }
    ::-webkit-scrollbar-thumb { background: #d8c6a8; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    .check-item.checked .check-box { background: var(--vermilion); border-color: var(--vermilion); color: #fff; }
    .check-item.checked .check-label { text-decoration: line-through; color: #9ca3af; }
    .divider-washi { background: repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(199,62,58,.25) 8px, rgba(199,62,58,.25) 10px); height: 3px; }
    .bottom-nav-item { transition: color .3s; }
    .bottom-nav-item.active { color: var(--vermilion); }
    #bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
    #mobile-menu { max-height: calc(100vh - 64px); overflow-y: auto; }
  </style>
</head>
<body class="paper-texture">
  <!-- 滚动进度条 -->
  <div id="progress-bar" class="fixed top-0 left-0 h-1 bg-gradient-to-r from-[#C73E3A] to-[#D4A24E] z-[60]" style="width:0%"></div>

  <!-- 顶部导航 -->
  <header id="navbar" class="sticky top-0 z-50 bg-[#FBF7F0]/90 backdrop-blur-md border-b border-[#e8dcc8]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
      <a href="#top" class="flex items-center gap-2 font-serif-sc font-bold text-lg text-[#1F2A44]">
        <span class="text-2xl">⛩️</span>
        <span>关西五日攻略书</span>
      </a>
      <nav id="nav-links" class="hidden lg:flex items-center gap-6 text-sm font-medium text-[#4b5563]"></nav>
      <button id="menu-toggle" class="lg:hidden w-10 h-10 flex items-center justify-center text-2xl text-[#1F2A44] transition" aria-label="打开菜单">☰</button>
    </div>
    <div id="mobile-menu" class="lg:hidden hidden bg-[#FBF7F0] border-t border-[#e8dcc8] px-4 py-2 shadow-md">
      <nav id="mobile-nav-links" class="flex flex-col text-sm font-medium text-[#4b5563]"></nav>
    </div>
  </header>

  <!-- 主内容挂载点 -->
  <main id="app"></main>

  <!-- 页脚 -->
  <footer class="mt-16 border-t border-[#e8dcc8] py-10 pb-28 lg:pb-10 text-center">
    <p class="font-serif-sc text-[#1F2A44] font-semibold">祝你有一段愉快的旅程 ✈️</p>
    <p class="mt-2 text-sm text-[#6b7280]">攻略内容基于你的行程规划整理 · 仅供参考，出行请以官方实时信息为准</p>
    <p class="mt-6 text-sm">由 <a href="https://with.woa.com/" style="color: #8A2BE2;" target="_blank">With</a> 通过自然语言生成</p>
  </footer>

  <!-- 返回顶部 -->
  <button id="back-top" class="fixed bottom-24 lg:bottom-8 right-4 lg:right-8 z-50 w-12 h-12 rounded-full bg-[#C73E3A] text-white shadow-lg hidden items-center justify-center hover:bg-[#A3302D] transition" title="返回顶部">↑</button>

  <!-- 移动端底部导航 -->
  <nav id="bottom-nav" class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-t border-[#e8dcc8] shadow-[0_-4px_16px_rgba(31,42,68,0.08)]">
    <div id="bottom-nav-inner" class="grid grid-cols-5"></div>
  </nav>

  <script type="module" src="./main.js"></script>
</body>
</html>
